name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Before submitting, check for an existing report. Do not include credentials or personal data. For vulnerabilities, follow SECURITY.md instead."
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened?
      placeholder: Describe the issue clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproducible sequence.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version, operating system, browser or other relevant details
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sanitized logs or screenshots, if helpful.
